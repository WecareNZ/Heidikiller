[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# SPA fallback — let the client router handle all non-function routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
